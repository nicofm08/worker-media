env:
  app_name: "worker-media"
  app_env: "qa"
  env_file: ".env.qa"
  registry: "ghcr.io"
  user_github: "nicofm08"
  port_server: 19004
  port_container: 8000
  ip_container: 172.22.19.2
  memory: 100m
  cpu: 0.5

name: Deploy to GitHub Packages

on:
    pull_request:
      branches:
        - _qa
      types:
        - opened
        - synchronize
jobs:
  create-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_CI_CD }}

      - name: Load environment variables
        run: |
            cp ${{ env.env_file }} .env

      - name: Build and push image
        run: |
            docker build . --tag ${{ env.registry }}/${{ env.user_github }}/${{ env.app_name }}-${{ env.app_env }}:${{ env.app_env }}
            docker push ${{ env.registry }}/${{ env.user_github }}/${{ env.app_name }}-${{ env.app_env }}:${{ env.app_env }}

  deploy:
    needs: create-docker-image
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: SSH into Server
        run: |
          sshpass -p ${{ secrets.SSH_PASSWORD }} ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER_HOST }} -p 5064 << EOF
            cd /docker_image_custom
            docker login ${{ env.registry }} -u ${{ env.user_github }} -p ${{ secrets.TOKEN_CI_CD }}
            docker stop ${{ env.app_name }}-${{ env.app_env }}  # Detener el contenedor
            docker rm ${{ env.app_name }}-${{ env.app_env }}  # Eliminar el contenedor
            docker rmi ${{ env.registry }}/${{ env.user_github }}/${{ env.app_name }}-${{ env.app_env }}:${{ env.app_env }} --force  # Eliminar la imagen forzadamente
            docker pull ${{ env.registry }}/${{ env.user_github }}/${{ env.app_name }}-${{ env.app_env }}:${{ env.app_env }} # Descargar la imagen
            docker network create --subnet=172.22.0.0/16 crazy-ntw # Crear una red
            docker run -d --memory="${{ env.memory }}" --cpus="${{ env.cpu }}" --name ${{ env.app_name }}-${{ env.app_env }} --net crazy-ntw  --ip ${{ env.ip_container }} -p ${{ env.port_server }}:${{ env.port_container }} ${{ env.registry }}/${{ env.user_github }}/${{ env.app_name }}-${{ env.app_env }}:${{ env.app_env }} # Correr la imagen
          EOF